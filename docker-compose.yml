services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: banking_app
      POSTGRES_USER: banking_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_app -d banking_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql://banking_app:${POSTGRES_PASSWORD:-local-demo-password}@database:5432/banking_app
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-before-deploy}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8081}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "8081:8081"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
